<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aladdin GB ROM Editor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Game Boy reverse engineering</p>
          <h1>Aladdin GB ROM Editor</h1>
        </div>

        <div class="toolbar">
          <button id="open-rom-button">Open ROM</button>
          <button id="save-rom-button" class="secondary">Save ROM</button>
          <button id="analyze-rom-button" class="ghost">Analyze ROM</button>
          <button id="export-sprite-button" class="ghost">Export sprite</button>
        </div>
      </header>

      <section class="control-strip">
        <div id="file-info">No ROM loaded</div>

        <div class="search-wrap">
          <input id="search-input" type="text" placeholder="Search hex (00 7F) or text" />
          <button id="search-button">Search</button>
        </div>
      </section>

      <section id="rom-info" class="rom-info">
        <div class="empty-state">Load a ROM to inspect metadata.</div>
      </section>

      <main class="workspace">
        <aside class="sidebar">
          <div class="panel-header">
            <h2>ROM sections</h2>
          </div>
          <div id="rom-sections" class="section-list"></div>
        </aside>

        <section class="main-panel">
          <div class="panel-header">
            <h2>Hex editor</h2>
          </div>
          <div class="hex-panel">
            <table id="hex-table">
              <tbody></tbody>
            </table>
          </div>

          <div class="tile-panel">
            <div class="panel-header compact">
              <h2>Tile viewer</h2>
            </div>
            <canvas id="tile-canvas" width="256" height="256"></canvas>
            <div id="tile-details" class="tile-details">Load a ROM to preview tiles.</div>
          </div>

          <div class="palette-panel">
            <div class="panel-header compact">
              <h2>Palette & sprite</h2>
            </div>

            <div id="palette-grid" class="palette-grid"></div>

            <div class="sprite-tools">
              <canvas id="sprite-canvas" width="128" height="128"></canvas>
              <div class="sprite-actions">
                <button id="extract-sprite-button" class="secondary">Extract sprite</button>
                <div id="sprite-details" class="tile-details">Select a tile to inspect sprite pixels.</div>
              </div>
            </div>
          </div>

          <div class="map-panel">
            <div class="panel-header compact">
              <h2>Map preview</h2>
            </div>
            <canvas id="map-canvas" width="320" height="320"></canvas>
            <div id="map-details" class="tile-details">Load a ROM to preview level map blocks.</div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
